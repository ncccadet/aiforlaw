 # Auto-deploy to staging EC2 on push to 'staging' branch.
# Nothing goes to production without passing staging first.

name: Deploy to Staging

on:
  push:
    branches: [main, staging]


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_REF_NAME
          script: |
            cd /home/ubuntu/voxera-law
            git fetch origin
            git reset --hard origin/${GITHUB_REF_NAME:-main} || { echo "DEPLOY ABORTED: git reset failed."; exit 1; }
            cd backend  && npm install --production
            cd ../frontend && npm install && npm run build
            # Same two-pass caching as production — see deploy-production.yml
            # for the full reasoning. Hashed assets cache forever; index.html
            # never caches, so a deploy actually reaches a device that has
            # visited before.
            aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_FRONTEND_STAGING }}/ --delete \
              --exclude "index.html" \
              --cache-control "public,max-age=31536000,immutable"
            aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_FRONTEND_STAGING }}/index.html \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "text/html"
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
            pm2 reload voxera-backend --update-env
            pm2 reload otp-worker --update-env
            echo "Staging deploy complete $(date)"
            pm2 reload voxera-backend --update-env
            pm2 reload otp-worker --update-env
            pm2 reload ai-interviewer-worker --update-env
            pm2 reload court-simulation-worker --update-env
            pm2 reload drafting-lab-worker --update-env
            pm2 reload resume-analyzer-worker --update-env
            pm2 reload resume-builder-worker --update-env
            echo "Staging deploy complete $(date)"
